    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #3a3530;
            background-color: #e8e4db; 
            overflow-x: hidden;
        }

        /* =========================================
           ВИДЕО-ФОН (НА ВЕСЬ ЭКРАН)
           ========================================= */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2; 
            object-fit: cover; 
            pointer-events: none;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.4); 
            z-index: -1;
            pointer-events: none;
        }

           ПЛАВАЮЩЕЕ СЕРДЕЧКО
